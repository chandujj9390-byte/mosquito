<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSQUITO</title>
  <meta name="description" content="Enter delivery address and recipient details for express dispatch." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            brand: ['Cinzel', 'Playfair Display', 'serif'],
            editorial: ['Cormorant Garamond', 'Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="bg-[#F8F8F6] text-neutral-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- ================= TOP HEADER BAR ================= -->
  <header class="bg-white border-b border-neutral-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <img src="/assets/logo.svg" alt="MOSQUITO" class="w-8 h-8 object-contain transition-transform group-hover:scale-105" />
        <span class="font-sans text-2xl font-black tracking-[0.15em] text-neutral-950 uppercase">MOSQUITO</span>
      </a>

      <div class="flex items-center gap-4 text-xs font-mono text-neutral-600">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-emerald-700 font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          256-Bit SSL Encrypted
        </span>
        <a href="index.html" class="px-3.5 py-1.5 rounded-full border border-neutral-300 hover:bg-neutral-100 transition-colors uppercase font-bold text-[11px]">
          ← Back to Shop
        </a>
      </div>
    </div>
  </header>

  <!-- ================= 3-STEP PROGRESS BAR ================= -->
  <div class="bg-white border-b border-neutral-200/80 py-3 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-center">
      <div class="flex items-center gap-2 sm:gap-4 overflow-x-auto scrollbar-none py-1">
        <!-- Step 1: Active -->
        <div class="step-tab-btn active">
          <span class="step-num">1</span>
          <span>Customer Details</span>
        </div>

        <div class="w-6 sm:w-12 h-[1.5px] bg-neutral-300"></div>

        <!-- Step 2: Inactive -->
        <div class="step-tab-btn opacity-60">
          <span class="step-num">2</span>
          <span>Payment Gateway</span>
        </div>

        <div class="w-6 sm:w-12 h-[1.5px] bg-neutral-300"></div>

        <!-- Step 3: Inactive -->
        <div class="step-tab-btn opacity-40 pointer-events-none">
          <span class="step-num">3</span>
          <span>Order Successful</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= MAIN CONTENT LAYOUT ================= -->
  <main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full">
    <!-- CUSTOMER DETAILS FORM -->
    <div class="bg-white p-6 sm:p-10 rounded-2xl border border-neutral-200/90 shadow-sm space-y-6">
      <div class="border-b border-neutral-100 pb-4">
        <h1 class="text-xl sm:text-2xl font-bold uppercase tracking-tight text-neutral-900">
          Customer & Delivery Details
        </h1>
        <p class="text-xs text-neutral-500 mt-1">
          Enter recipient and delivery address for complimentary domestic express dispatch.
        </p>
      </div>

      <form id="customer-details-form" onsubmit="event.preventDefault(); proceedToPayment();" class="space-y-4 text-xs">
        <!-- Full Legal Name -->
        <div>
          <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">Full Legal Name *</label>
          <input type="text" id="cust-name" required class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-3 text-neutral-900 font-sans focus:bg-white focus:outline-none focus:border-black transition-colors" />
        </div>

        <!-- Mobile Number & Email -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">Mobile Number (For Delivery OTP) *</label>
            <div class="flex">
              <span class="inline-flex items-center px-3.5 bg-neutral-100 border border-r-0 border-neutral-200 rounded-l-lg text-neutral-700 font-mono text-xs font-bold">+91</span>
              <input type="tel" id="cust-phone" required maxlength="10" class="w-full bg-neutral-50 border border-neutral-200 rounded-r-lg px-3.5 py-3 text-neutral-900 font-mono focus:bg-white focus:outline-none focus:border-black transition-colors" />
            </div>
          </div>

          <div>
            <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">Email Address (For Digital Invoice)</label>
            <input type="email" id="cust-email" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-3 text-neutral-900 font-sans focus:bg-white focus:outline-none focus:border-black transition-colors" />
          </div>
        </div>

        <!-- 6-Digit Pincode & City -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">6-Digit Indian Pincode *</label>
            <input type="text" id="cust-pincode" required maxlength="6" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-3 text-neutral-900 font-mono font-bold focus:bg-white focus:outline-none focus:border-black transition-colors" />
            <div id="pincode-status-badge" class="hidden text-[11px] text-emerald-700 font-medium mt-1.5 flex items-center gap-1"></div>
          </div>

          <div>
            <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">City / Town *</label>
            <input type="text" id="cust-city" required class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-3 text-neutral-900 font-sans focus:bg-white focus:outline-none focus:border-black transition-colors" />
          </div>
        </div>

        <!-- Street Address -->
        <div>
          <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">Flat / House No., Building, Street & Landmark *</label>
          <input type="text" id="cust-address" required class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-3 text-neutral-900 font-sans focus:bg-white focus:outline-none focus:border-black transition-colors" />
        </div>

        <!-- State / Province -->
        <div>
          <label class="block font-mono uppercase text-[10px] text-neutral-500 font-semibold mb-1">State / Province *</label>
          <select id="cust-state" required class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3.5 py-3 text-neutral-900 font-sans focus:bg-white focus:outline-none focus:border-black transition-colors cursor-pointer appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2220%22%20height%3D%2220%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22%23666%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M6%208l4%204%204-4%22%2F%3E%3C%2Fsvg%3E')] bg-[length:1.25rem] bg-[right_0.85rem_center] bg-no-repeat pr-10">
            <option value="" disabled selected>-- Select State / Union Territory --</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
            <option value="Chandigarh">Chandigarh</option>
            <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
            <option value="Delhi">Delhi</option>
            <option value="Jammu and Kashmir">Jammu and Kashmir</option>
            <option value="Ladakh">Ladakh</option>
            <option value="Lakshadweep">Lakshadweep</option>
            <option value="Puducherry">Puducherry</option>
          </select>
        </div>

        <!-- Checkboxes -->
        <div class="pt-2 space-y-2 text-xs border-t border-neutral-100">
          <label class="flex items-center gap-2.5 cursor-pointer text-neutral-700">
            <input type="checkbox" id="cust-save-address" class="w-4 h-4 rounded text-black accent-black cursor-pointer" />
            <span>Save this delivery address for 1-click repeat orders</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer text-neutral-700">
            <input type="checkbox" id="cust-whatsapp-optin" checked class="w-4 h-4 rounded text-emerald-600 accent-emerald-600 cursor-pointer" />
            <span class="text-emerald-800 font-medium">Send real-time dispatch & live tracking updates to WhatsApp</span>
          </label>
        </div>

        <!-- Prominent NEXT Button -->
        <div class="pt-6 border-t border-neutral-100 flex items-center justify-between">
          <a href="index.html" class="px-5 py-3 border border-neutral-300 rounded-full font-mono text-xs uppercase font-bold text-neutral-700 hover:bg-neutral-100 transition-colors">
            ← Back
          </a>
          <button type="submit" id="proceed-btn" class="px-9 py-3.5 bg-neutral-950 hover:bg-black text-white rounded-full font-mono text-xs uppercase tracking-widest font-bold transition-all shadow-lg flex items-center gap-2 cursor-pointer">
            <span>Next</span>
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="bg-white border-t border-neutral-200 py-6 text-center text-xs text-neutral-500 font-mono">
    © 2026 MOSQUITO APPAREL PRIVATE LIMITED. ALL RIGHTS RESERVED.
  </footer>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    const PINCODE_MAP = {
      '400': { city: 'Mumbai', state: 'Maharashtra' },
      '401': { city: 'Thane', state: 'Maharashtra' },
      '411': { city: 'Pune', state: 'Maharashtra' },
      '110': { city: 'New Delhi', state: 'Delhi' },
      '560': { city: 'Bengaluru', state: 'Karnataka' },
      '500': { city: 'Hyderabad', state: 'Telangana' },
      '600': { city: 'Chennai', state: 'Tamil Nadu' },
      '700': { city: 'Kolkata', state: 'West Bengal' },
      '302': { city: 'Jaipur', state: 'Rajasthan' },
      '380': { city: 'Ahmedabad', state: 'Gujarat' },
      '517': { city: 'Tirupati', state: 'Andhra Pradesh' },
      '530': { city: 'Visakhapatnam', state: 'Andhra Pradesh' }
    };

    function initPage() {
      // Ensure cart has items
      let cart = JSON.parse(localStorage.getItem('mosquito_cart') || '[]');
      if (cart.length === 0) {
        // Fallback default item if cart was empty
        cart = [{
          id: 'm-shirt-1',
          name: 'MOSQUITO EMBROIDERED SHIRT',
          priceINR: 849,
          image: '/assets/products/men/Embroided Shirts.jpg',
          size: 'M',
          category: 'Embroidered Shirts',
          quantity: 1
        }];
        localStorage.setItem('mosquito_cart', JSON.stringify(cart));
      }

      renderSummary();
      initPincodeLookup();
    }

    function renderSummary() {
      const cart = JSON.parse(localStorage.getItem('mosquito_cart') || '[]');
      const itemsList = document.getElementById('order-items-list');
      const countBadge = document.getElementById('order-count-badge');
      const subtotalEl = document.getElementById('summary-subtotal');
      const discountRow = document.getElementById('summary-discount-row');
      const discountEl = document.getElementById('summary-discount');
      const totalEl = document.getElementById('summary-total');

      if (!itemsList) return;

      countBadge.textContent = `${cart.length} ${cart.length === 1 ? 'Item' : 'Items'}`;

      let subtotal = 0;
      itemsList.innerHTML = cart.map((item, idx) => {
        subtotal += item.priceINR * item.quantity;
        return `
          <div class="flex items-center gap-3 py-2 text-xs">
            <img src="${item.image}" alt="${item.name}" class="w-12 h-14 object-cover rounded-lg border border-neutral-200" />
            <div class="flex-1 min-w-0">
              <div class="font-bold text-neutral-900 truncate uppercase text-[11px]">${item.name}</div>
              <div class="text-neutral-500 text-[10px]">Size: <span class="font-bold">${item.size}</span> • Qty: ${item.quantity}</div>
            </div>
            <div class="font-mono font-bold text-neutral-900">
              Rs. ${(item.priceINR * item.quantity).toLocaleString('en-IN')}.00
            </div>
          </div>
        `;
      }).join('');

      const promo = JSON.parse(localStorage.getItem('mosquito_promo') || 'null');
      let discount = 0;
      if (promo && promo.code === 'MOSQUITO10') {
        discount = Math.round(subtotal * 0.10);
        discountRow.classList.remove('hidden');
        discountEl.textContent = `-Rs. ${discount.toLocaleString('en-IN')}.00`;
      } else {
        discountRow.classList.add('hidden');
      }

      const total = subtotal - discount;
      subtotalEl.textContent = `Rs. ${subtotal.toLocaleString('en-IN')}.00`;
      totalEl.textContent = `Rs. ${total.toLocaleString('en-IN')}.00`;
    }

    function applyPromo() {
      const val = document.getElementById('promo-input')?.value.trim().toUpperCase();
      if (val === 'MOSQUITO10' || val === 'VIP20') {
        localStorage.setItem('mosquito_promo', JSON.stringify({ code: val, percent: 10 }));
        showToast('✓ Promo code applied! 10% discount added.');
        renderSummary();
      } else {
        showToast('Invalid promo code. Try MOSQUITO10');
      }
    }

    function initPincodeLookup() {
      const pinInput = document.getElementById('cust-pincode');
      const badge = document.getElementById('pincode-status-badge');
      if (pinInput) {
        pinInput.addEventListener('input', (e) => {
          const pin = e.target.value.replace(/\D/g, '').substring(0, 6);
          e.target.value = pin;
          if (pin.length >= 3) {
            const match = PINCODE_MAP[pin.substring(0, 3)];
            if (match) {
              document.getElementById('cust-city').value = match.city;
              document.getElementById('cust-state').value = match.state;
              badge.innerHTML = `✓ Domestic Express Delivery Available to <strong>${match.city}, ${match.state}</strong>`;
              badge.classList.remove('hidden');
            } else if (pin.length === 6) {
              badge.innerHTML = `✓ Domestic Express Delivery Available across India (2-3 Days)`;
              badge.classList.remove('hidden');
            }
          }
        });
      }

      const phoneInput = document.getElementById('cust-phone');
      if (phoneInput) {
        phoneInput.addEventListener('input', (e) => {
          let val = e.target.value.replace(/\D/g, '');
          if (val.startsWith('91')) val = val.substring(2);
          e.target.value = val.substring(0, 10);
        });
      }
    }

    function proceedToPayment() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const email = document.getElementById('cust-email').value.trim();
      const pincode = document.getElementById('cust-pincode').value.trim();
      const city = document.getElementById('cust-city').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const state = document.getElementById('cust-state').value.trim();

      if (!name || phone.length < 10 || !address || pincode.length < 6) {
        showToast('Please fill all mandatory fields correctly.');
        return;
      }

      const customerData = { name, phone, email, pincode, city, address, state };
      localStorage.setItem('mosquito_checkout_customer', JSON.stringify(customerData));

      // Navigate to Payment Gateway page
      window.location.href = 'payment.html';
    }

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span class="font-medium text-xs">${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
  <script src="/js/lenis-scroll.js"></script>
</body>
</html>
